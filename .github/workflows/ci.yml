name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the bridge capability vocabulary is generated from its spec
        # spec/bridge-capabilities.json is the single source of truth for the
        # Kotlin, Swift and TypeScript vocabularies; the generated files are
        # committed so consumers never run the generator. This fails when the
        # spec changed without regenerating (`tools/gen_bridge_capabilities.py`).
        run: python3 tools/gen_bridge_capabilities.py --check --only kotlin ts

      - name: Check the public API against api/*.api
        # Fails on any signature change in a published module. An intended
        # change is recorded with `./gradlew apiDump` and reviewed as a diff.
        run: ./gradlew apiCheck --no-daemon

      - name: Configure the FaceTec SDK repository
        # Supplies the AAR that FaceTec10ApiContractTest checks FaceTecApi's reflection
        # against. Without it that test assumes-out, which is how the FaceTec 9 -> 10 break
        # (#246) reached main unnoticed. Secrets are absent on forked-PR runs, so a missing
        # URL warns and the test skips as before rather than failing the build.
        env:
          FACETEC_MAVEN_URL: ${{ secrets.FACETEC_MAVEN_URL }}
          FACETEC_MAVEN_TOKEN: ${{ secrets.VENDOR_PACKAGES_TOKEN }}
        run: |
          if [ -n "$FACETEC_MAVEN_URL" ]; then
            echo "facetecMavenUrl=$FACETEC_MAVEN_URL" >> gradle.properties
            echo "facetecMavenToken=$FACETEC_MAVEN_TOKEN" >> gradle.properties
            echo "FaceTec repository configured; the AAR contract check will run."
          else
            echo "::warning title=FaceTec contract check skipped::FACETEC_MAVEN_URL is not set, so FaceTec10ApiContractTest cannot see a real AAR and will skip."
          fi

      - name: Run unit tests
        # No module is excluded. The sample app's unit tests used to be, which
        # let its test source set stop compiling for months without CI noticing
        # (#131 moved a class into the SDK and left its test behind) - and the
        # documented `./gradlew test` was red for everyone who ran it.
        run: ./gradlew test --no-daemon

      - name: Generate coverage report
        run: ./gradlew koverXmlReport -x :sample-app:koverXmlReport --no-daemon

      - name: Summarize coverage
        env:
          COVERAGE_MIN_PCT: "25"
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob('sdk/*/build/reports/kover/report.xml'))
          reports += sorted(glob.glob('sample-app/build/reports/kover/report.xml'))

          total_missed = 0
          total_covered = 0

          for path in reports:
              root = ET.parse(path).getroot()
              for counter in root.findall('counter'):
                  if counter.attrib.get('type') == 'LINE':
                      missed = int(counter.attrib.get('missed', 0))
                      covered = int(counter.attrib.get('covered', 0))
                      total_missed += missed
                      total_covered += covered
                      break

          total = total_missed + total_covered
          pct = (100.0 * total_covered / total) if total else 0.0
          min_pct = float(os.environ.get('COVERAGE_MIN_PCT', '0'))

          print(f'Aggregated line coverage (sdk modules + sample-app): {pct:.2f}%')
          print(f'Required minimum coverage: {min_pct:.2f}%')

          if pct < min_pct:
              print(
                  f'Coverage gate failed: {pct:.2f}% < {min_pct:.2f}%',
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/build/reports/kover/**'

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: sdk/transport/build/reports/kover/report.xml,sdk/auth/build/reports/kover/report.xml,sdk/credentials/build/reports/kover/report.xml,sdk/keystore/build/reports/kover/report.xml,sdk/flow/build/reports/kover/report.xml,sdk/wallet/build/reports/kover/report.xml,sdk/passkey-provider/build/reports/kover/report.xml
          flags: android
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assemble --no-daemon

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Dokka documentation
        run: ./gradlew dokkaGenerate --no-daemon
