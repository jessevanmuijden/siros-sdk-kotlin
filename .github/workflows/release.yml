name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build SDK & Sample App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure vendor Maven repository
        run: |
          mkdir -p ~/.gradle
          echo "facetecMavenUrl=${{ secrets.FACETEC_MAVEN_URL }}" >> gradle.properties
          echo "facetecMavenToken=${{ secrets.VENDOR_PACKAGES_TOKEN }}" >> gradle.properties

      - name: Build SDK AARs
        run: ./gradlew assembleRelease -x test -x lint

      - name: Build sample APK
        run: ./gradlew :sample-app:assembleDebug -x test -x lint

      - name: Collect artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          # SDK modules — rename AARs to include module name + version
          for aar in $(find sdk -name "*.aar" -path "*/release/*"); do
            module=$(echo "$aar" | sed 's|sdk/\([^/]*\)/.*|\1|')
            cp "$aar" "release-artifacts/siros-sdk-${module}-${VERSION}.aar"
          done
          # Sample APK
          find sample-app -name "*.apk" -path "*/debug/*" -exec cp {} "release-artifacts/siros-sample-app-${VERSION}.apk" \;
          # Bridge capability vocabulary: the spec and its TypeScript, for the
          # frontend's bridge contract package to pin by SDK version.
          cp spec/bridge-capabilities.json "release-artifacts/bridge-capabilities-${VERSION}.json"
          cp spec/generated/bridge-capabilities.ts "release-artifacts/bridge-capabilities-${VERSION}.ts"
          ls -la release-artifacts/

      # Attaching the artifacts is the flakiest step in this workflow: it has
      # failed on three consecutive releases, with an HTML error page
      # mid-upload and then twice with "Error creating asset temp dir", both
      # from the runner rather than from anything here. Each attempt is
      # conditioned on the previous attempt's OUTCOME rather than on
      # `failure()`, so an unrelated failure earlier in the job does not
      # trigger a pointless re-upload, and a flake does not leave the job
      # marked failed once a later attempt succeeded. The last attempt has no
      # continue-on-error, so a persistent failure still fails the job.
      - name: Create GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry the release upload (1)
        id: release_retry_1
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry the release upload (2)
        if: steps.release_retry_1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: build`. Publication to Maven Central and GitHub
    # Packages is what makes a tag a release for consumers; it must not be
    # suppressed because attaching a file to the GitHub release page flaked.
    # Both v0.17.0 and v0.18.0 lost their publish this way - the build job
    # failed on an upload, this job was skipped, and the version existed
    # nowhere a consumer could resolve it until the jobs were re-run by hand.
    # This job builds and signs the artifacts itself from the tag, so it does
    # not depend on anything the build job produced.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The version is the tag's, not gradle.properties' `sdkVersion` (which
      # is the NEXT release's) - so a re-tag can never publish under a stale
      # number, and a failure here fails the job: the `|| echo skipping` that
      # used to follow this hid the fact that no publish task existed at all.
      #
      # continue-on-error, with the job failed explicitly at the end if this
      # step failed: v0.20.2 lost its Maven Central publish this way - a
      # single module's upload hit a 409 (GitHub Packages returned it for an
      # artifact that turned out to already be present, most likely a
      # network retry racing its own earlier success rather than a real
      # duplicate), which stopped the job before it ever reached the Maven
      # Central step below, even though every other module's GitHub Packages
      # upload - and Maven Central itself - had nothing to do with that
      # failure. The two publish targets must not gate each other, same
      # reasoning as this job's own doc comment above about not depending on
      # the build job.
      - name: Publish SDK to GitHub Packages
        id: gh_packages
        continue-on-error: true
        run: ./gradlew publish -PsdkVersion="${GITHUB_REF_NAME#v}" -x test -x lint
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Maven Central, via the Central Portal publisher API (Nmcp, see
      # settings.gradle.kts): every module plus the BOM in ONE deployment,
      # signed with the org's SDK signing key. AUTOMATIC: published as soon
      # as Central's validation passes, no portal step. Runs regardless of
      # the GitHub Packages step's outcome (see that step's comment).
      - name: Publish SDK to Maven Central
        run: ./gradlew nmcpPublishAggregationToCentralPortal -PsdkVersion="${GITHUB_REF_NAME#v}" -x test -x lint
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      # The `continue-on-error` above must not silently mask a genuine
      # GitHub Packages publish failure - only decouple it from Maven
      # Central. Fails the job now that Maven Central has had its chance to
      # run either way.
      - name: Fail the job if GitHub Packages publish failed
        if: steps.gh_packages.outcome == 'failure'
        run: |
          echo "::error::Publish SDK to GitHub Packages failed - see that step's log above."
          exit 1
